<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>קרנבל התחפושות</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Scripts: React, Tailwind, Firebase -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: 'Rubik', sans-serif;
            background-color: #fff7ed;
            background-image: 
                radial-gradient(#facc15 0.5px, transparent 0.5px),
                radial-gradient(#facc15 0.5px, #fff7ed 0.5px);
            background-size: 20px 20px;
            direction: rtl;
        }
        .circus-header {
            background: #e11d48;
            background-image: repeating-linear-gradient(45deg, #e11d48, #e11d48 20px, #be123c 20px, #be123c 40px);
            border-bottom: 8px solid #facc15;
        }
        .btn-primary {
            background-color: #be123c !important;
            color: white !important;
            border: 3px solid #000 !important;
            box-shadow: 0 4px 0 #000 !important;
            transition: all 0.1s;
        }
        .btn-primary:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #000 !important;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #be123c;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-pop {
            animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Icons as Functional Components ---
        const LockIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>;
        const UnlockIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>;
        const PartyIcon = () => <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 22h14a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v10"></path><path d="m14 2 5 5"></path><path d="m2 22 10-10"></path><path d="m8 11 5 5"></path></svg>;
        const CrownIcon = () => <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-yellow-500"><path d="M2 4l3 12h14l3-12-6 7-4-7-4 7-6-7z"></path></svg>;
        const CopyIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>;

        // --- Firebase Configuration ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "", authDomain: "", projectId: "", storageBucket: "", messagingSenderId: "", appId: "" };
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'purim-contest-2025';
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const STAGES = { UPLOAD: 'upload', VOTING: 'voting', RESULTS: 'results' };

        // Helper: Image compression
        const compressImage = (base64Str) => {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = base64Str;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 500;
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', 0.6));
                };
            });
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [roomId, setRoomId] = useState('תחרות-מרכזית');
            const [stage, setStage] = useState(STAGES.UPLOAD);
            const [contestTitle, setContestTitle] = useState('קרנבל התחפושות');
            const [participants, setParticipants] = useState([]);
            const [votes, setVotes] = useState([]);
            const [isAdmin, setIsAdmin] = useState(false);
            const [msg, setMsg] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);

            const showMsg = (text) => { setMsg(text); setTimeout(() => setMsg(null), 3000); };

            // RULE 3: Initial Authentication sequence
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await auth.signInWithCustomToken(__initial_auth_token);
                        } else {
                            await auth.signInAnonymously();
                        }
                    } catch (error) {
                        console.error("Auth Error:", error);
                    }
                };
                initAuth();

                const unsubscribe = auth.onAuthStateChanged((u) => {
                    if (u) {
                        setUser(u);
                        setAuthLoading(false);
                    }
                });

                const r = new URLSearchParams(window.location.search).get('room');
                if (r) setRoomId(r);

                return () => unsubscribe();
            }, []);

            // RULE 3: Data synchronization ONLY after auth is successful
            useEffect(() => {
                if (!user) return;

                // RULE 1: Using strict path artifacts/{appId}/public/data/...
                const roomPath = `artifacts/${appId}/public/data/rooms/${roomId}`;
                const roomRef = db.doc(roomPath);

                const unsubRoom = roomRef.onSnapshot(doc => {
                    if (doc.exists) {
                        const data = doc.data();
                        setStage(data.stage || STAGES.UPLOAD);
                        setContestTitle(data.title || "קרנבל התחפושות");
                    } else {
                        // Initialize room if it doesn't exist
                        roomRef.set({ stage: STAGES.UPLOAD, title: "קרנבל התחפושות" })
                               .catch(err => console.error("Room init error:", err));
                    }
                }, err => console.error("Room Snapshot Error:", err));

                const partsRef = db.collection(`artifacts/${appId}/public/data/participants`);
                const unsubParts = partsRef.onSnapshot(snap => {
                    const list = snap.docs
                        .map(d => ({ id: d.id, ...d.data() }))
                        .filter(p => p.roomId === roomId);
                    setParticipants(list);
                }, err => console.error("Participants Snapshot Error:", err));

                const votesRef = db.collection(`artifacts/${appId}/public/data/votes`);
                const unsubVotes = votesRef.onSnapshot(snap => {
                    const list = snap.docs
                        .map(d => d.data())
                        .filter(v => v.roomId === roomId);
                    setVotes(list);
                }, err => console.error("Votes Snapshot Error:", err));

                if (sessionStorage.getItem(`admin_${roomId}`) === 'true') setIsAdmin(true);

                return () => {
                    unsubRoom();
                    unsubParts();
                    unsubVotes();
                };
            }, [user, roomId]);

            const handleAdd = async (name, costume, img) => {
                if (!user) return;
                try {
                    const compressed = await compressImage(img);
                    await db.collection(`artifacts/${appId}/public/data/participants`).add({
                        name, 
                        costume, 
                        img: compressed, 
                        roomId, 
                        userId: user.uid, 
                        createdAt: new Date().toISOString()
                    });
                    showMsg("התחפושת עלתה בהצלחה! 🎉");
                } catch (e) {
                    console.error(e);
                    showMsg("תקלה בהעלאת התמונה ❌");
                }
            };

            const handleVote = async (targetId, points) => {
                if (!user) return;
                try {
                    await db.collection(`artifacts/${appId}/public/data/votes`).add({
                        voterId: user.uid, 
                        targetId, 
                        points, 
                        roomId, 
                        timestamp: new Date().toISOString()
                    });
                    showMsg("הצבעתך נקלטה! ✅");
                } catch (e) {
                    console.error(e);
                    showMsg("תקלה בשליחת ההצבעה ❌");
                }
            };

            const results = useMemo(() => {
                const scores = {};
                participants.forEach(p => scores[p.id] = { ...p, score: 0 });
                votes.forEach(v => {
                    if (scores[v.targetId]) scores[v.targetId].score += v.points;
                });
                return Object.values(scores).sort((a, b) => b.score - a.score);
            }, [participants, votes]);

            if (authLoading) return (
                <div className="min-h-screen flex flex-col items-center justify-center font-bold text-rose-600 gap-4">
                    <div className="loader"></div>
                    <p className="text-xl">מתחבר למסד הנתונים...</p>
                </div>
            );

            return (
                <div className="min-h-screen pb-20">
                    {msg && <div className="fixed top-24 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-xl font-bold z-[1000] shadow-2xl animate-pop">{msg}</div>}

                    <header className="circus-header p-6 text-white shadow-xl flex justify-between items-center sticky top-0 z-50">
                        <div className="flex items-center gap-4">
                            <div className="bg-white p-2 rounded-full text-rose-600"><PartyIcon /></div>
                            <div>
                                <h1 className="text-xl md:text-2xl font-bold truncate max-w-[150px]">{contestTitle}</h1>
                                <p className="text-yellow-300 text-xs font-bold">פעיל בזמן אמת ✨</p>
                            </div>
                        </div>
                        <button onClick={() => {
                            const p = prompt("קוד מנהל (2025):");
                            if (p === "2025") { 
                                setIsAdmin(true); 
                                sessionStorage.setItem(`admin_${roomId}`, 'true'); 
                            } else if (p !== null) {
                                alert("קוד שגוי");
                            }
                        }} className="p-3 bg-white/20 rounded-xl border border-white/30 hover:bg-white/40 transition-all">
                            {isAdmin ? <UnlockIcon /> : <LockIcon />}
                        </button>
                    </header>

                    <div className="max-w-4xl mx-auto px-6 py-8">
                        {isAdmin && (
                            <div className="bg-white p-6 rounded-[2rem] mb-10 shadow-lg border-4 border-yellow-400 animate-pop">
                                <h3 className="font-bold text-rose-600 mb-4 flex items-center gap-2">ניהול שלבי התחרות (למורה):</h3>
                                <div className="flex bg-slate-100 p-1.5 rounded-2xl gap-2">
                                    <button onClick={() => db.doc(`artifacts/${appId}/public/data/rooms/${roomId}`).update({stage: STAGES.UPLOAD})} className={`flex-1 py-3 rounded-xl font-bold transition-all ${stage === STAGES.UPLOAD ? 'bg-rose-600 text-white shadow-md' : 'text-slate-500'}`}>1. העלאה</button>
                                    <button onClick={() => db.doc(`artifacts/${appId}/public/data/rooms/${roomId}`).update({stage: STAGES.VOTING})} className={`flex-1 py-3 rounded-xl font-bold transition-all ${stage === STAGES.VOTING ? 'bg-rose-600 text-white shadow-md' : 'text-slate-500'}`}>2. הצבעה</button>
                                    <button onClick={() => db.doc(`artifacts/${appId}/public/data/rooms/${roomId}`).update({stage: STAGES.RESULTS})} className={`flex-1 py-3 rounded-xl font-bold transition-all ${stage === STAGES.RESULTS ? 'bg-rose-600 text-white shadow-md' : 'text-slate-500'}`}>3. תוצאות</button>
                                </div>
                                <div className="mt-6 p-4 bg-yellow-50 rounded-xl border border-yellow-200">
                                    <p className="text-xs font-bold text-slate-600 mb-2">קישור להפצה לתלמידים:</p>
                                    <div className="bg-white p-3 rounded border border-slate-200 text-[10px] font-mono break-all select-all text-right" dir="ltr">
                                        {window.location.origin}{window.location.pathname}?room={roomId}
                                    </div>
                                </div>
                            </div>
                        )}

                        <main>
                            {stage === STAGES.UPLOAD && <UploadView onAdd={handleAdd} participants={participants} myId={user.uid} />}
                            {stage === STAGES.VOTING && <VotingView participants={participants} onVote={handleVote} />}
                            {stage === STAGES.RESULTS && <ResultsView results={results} />}
                        </main>
                    </div>
                </div>
            );
        };

        const UploadView = ({ onAdd, participants, myId }) => {
            const [name, setName] = useState("");
            const [costume, setCostume] = useState("");
            const [img, setImg] = useState("");
            const [loading, setLoading] = useState(false);
            const hasUploaded = participants.some(p => p.userId === myId);

            const handleFile = (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (file.size > 2000000) {
                        alert("התמונה גדולה מדי. נסה להעלות תמונה קטנה מ-2MB.");
                        return;
                    }
                    const reader = new FileReader();
                    reader.onloadend = () => setImg(reader.result);
                    reader.readAsDataURL(file);
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!img) return;
                setLoading(true);
                await onAdd(name, costume, img);
                setLoading(false);
                setName(""); setCostume(""); setImg("");
            };

            return (
                <div className="space-y-12">
                    {!hasUploaded ? (
                        <div className="bg-white p-8 rounded-[2.5rem] shadow-xl border-4 border-white text-right animate-in slide-in-from-bottom-5">
                            <h2 className="text-2xl font-bold text-rose-600 mb-6">העלאת תחפושת ✨</h2>
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <input value={name} onChange={e => setName(e.target.value)} placeholder="שם המשתתף" className="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-rose-600 font-bold" required />
                                <input value={costume} onChange={e => setCostume(e.target.value)} placeholder="מה התחפושת?" className="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-rose-600 font-bold" required />
                                <div className="border-4 border-dashed border-slate-200 rounded-2xl p-6 text-center cursor-pointer relative h-48 flex items-center justify-center overflow-hidden hover:bg-slate-50 transition-colors">
                                    {img ? <img src={img} className="absolute inset-0 w-full h-full object-cover" /> : <span>לחצו לבחירת תמונה 📸</span>}
                                    <input type="file" onChange={handleFile} className="absolute inset-0 opacity-0 cursor-pointer" accept="image/*" />
                                </div>
                                <button type="submit" disabled={!img || loading} className="btn-primary w-full py-4 rounded-2xl font-bold text-xl flex items-center justify-center gap-2">
                                    {loading ? <div className="loader" style={{width:'20px',height:'20px'}}></div> : "הוספה לתחרות! 🔥"}
                                </button>
                            </form>
                        </div>
                    ) : <div className="bg-rose-600 text-white p-10 rounded-[2.5rem] text-center font-bold text-2xl animate-pulse shadow-xl border-4 border-white">התחפושת שלך נקלטה בהצלחה! 🎉</div>}
                    
                    <div className="grid grid-cols-2 md:grid-cols-3 gap-6">
                        {participants.map(p => (
                            <div key={p.id} className="bg-white rounded-2xl overflow-hidden shadow-lg border-2 border-white animate-pop">
                                <img src={p.img} className="aspect-[3/4] object-cover w-full" />
                                <div className="p-3 text-center">
                                    <p className="font-bold text-slate-800 truncate">{p.name}</p>
                                    <p className="text-rose-600 text-[10px] font-bold">{p.costume}</p>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const VotingView = ({ participants, onVote }) => (
            <div className="space-y-8 text-center animate-in zoom-in">
                <h2 className="text-3xl font-bold text-rose-600 mb-2">שלב ההצבעה! 🗳️</h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8">
                    {participants.map(p => (
                        <div key={p.id} className="bg-white rounded-[2rem] overflow-hidden shadow-2xl border-4 border-white hover:border-yellow-400 transition-all">
                            <img src={p.img} className="aspect-[4/5] object-cover w-full" />
                            <div className="p-4">
                                <p className="font-bold text-xl mb-4 text-slate-800">{p.name}</p>
                                <div className="flex flex-col gap-2">
                                    <button onClick={() => onVote(p.id, 3)} className="py-2 bg-yellow-400 text-rose-700 font-bold rounded-xl text-sm active:scale-95 transition-transform">🥇 3 נקודות</button>
                                    <button onClick={() => onVote(p.id, 2)} className="py-2 bg-slate-200 text-slate-700 font-bold rounded-xl text-sm active:scale-95 transition-transform">🥈 2 נקודות</button>
                                    <button onClick={() => onVote(p.id, 1)} className="py-2 bg-orange-100 text-orange-700 font-bold rounded-xl text-sm active:scale-95 transition-transform">🥉 1 נקודה</button>
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
                {participants.length === 0 && <p className="text-slate-500 font-bold py-10">עוד אין תחפושות להצביע להן...</p>}
            </div>
        );

        const ResultsView = ({ results }) => (
            <div className="text-center animate-in zoom-in duration-700">
                <h2 className="text-4xl font-bold text-rose-600 mb-12 flex flex-col gap-2 items-center">
                    <span className="text-6xl">🏆</span> הזוכים הגדולים!
                </h2>
                <div className="flex justify-center items-end gap-2 md:gap-8 mb-20 px-2">
                    {/* Place 2 */}
                    {results[1] && <div className="flex flex-col items-center">
                        <img src={results[1].img} className="w-24 h-24 md:w-36 md:h-36 rounded-2xl border-4 border-slate-300 object-cover shadow-lg" />
                        <div className="h-32 w-28 md:w-40 bg-slate-200 rounded-t-[2rem] mt-4 flex flex-col items-center pt-4 border-x-2 border-slate-300">
                            <span className="text-2xl font-bold text-slate-500">2</span>
                            <span className="text-sm font-bold truncate px-1 text-slate-700">{results[1].name}</span>
                        </div>
                    </div>}
                    {results[0] && <div className="flex flex-col items-center z-10 scale-110">
                        <div className="animate-bounce"><CrownIcon /></div>
                        <img src={results[0].img} className="w-32 h-32 md:w-44 md:h-44 rounded-[2.5rem] border-8 border-yellow-400 object-cover shadow-2xl" />
                        <div className="h-44 w-32 md:w-40 bg-rose-600 rounded-t-3xl mt-4 flex flex-col items-center pt-4 text-white border-x-2 border-rose-800">
                            <span className="text-4xl font-bold">1</span>
                            <span className="text-lg font-bold truncate px-1">{results[0].name}</span>
                        </div>
                    </div>}
                    {results[2] && <div className="flex flex-col items-center">
                        <img src={results[2].img} className="w-20 h-20 md:w-28 md:h-28 rounded-2xl border-4 border-orange-300 object-cover shadow-lg" />
                        <div className="h-24 w-20 md:w-28 bg-orange-200 rounded-t-2xl mt-4 flex flex-col items-center pt-4 border-x-2 border-orange-300">
                            <span className="text-2xl font-bold text-orange-700">3</span>
                            <span className="text-xs font-bold truncate px-1 text-orange-800">{results[2].name}</span>
                        </div>
                    </div>}
                </div>
                <div className="max-w-xl mx-auto space-y-3 px-4 text-right">
                    {results.slice(3).map((r, i) => (
                        <div key={r.id} className="flex justify-between items-center p-4 bg-white rounded-2xl shadow-md border border-slate-100">
                            <div className="flex items-center gap-3">
                                <span className="font-bold text-slate-300 w-6">#{i+4}</span>
                                <img src={r.img} className="w-12 h-12 rounded-xl object-cover shadow-sm" />
                                <div className="text-right text-slate-800">
                                    <p className="font-bold text-lg leading-tight">{r.name}</p>
                                    <p className="text-rose-600 text-[10px] font-bold mt-1">בתור: {r.costume}</p>
                                </div>
                            </div>
                            <div className="bg-rose-50 text-rose-600 px-3 py-1 rounded-full font-bold text-sm">{r.score} נק'</div>
                        </div>
                    ))}
                </div>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
